# Fritchii-HDrum fork module manifest
# Source of truth for modules to re-apply after an upstream Fritchii update.
# To add a module: append an entry with a unique id and enabled: true.
# To stop applying a module: set enabled: false (do not delete its history casually).
schema_version: 1
last_updated: 2026-11-12

# Current fork branch containing the active module set and its latest integration work.
# This is a working branch, not the repository's stable default branch.
active_module_branch:
  name: feature/v5.8.4-renhdrum-zh-cn
  url: https://github.com/byronlai99/Fritchii-HDrum/tree/feature/v5.8.4-renhdrum-zh-cn
  status: integration-in-progress
  purpose: Current module integration branch for the v5.8.4 upstream baseline.
  stable_default_branch: fix/v5.6-msvc-c4458-packet-shadow

baseline:
  upstream_repository: Frizti/Fritchii
  upstream_tag: fritchii-v5.8.4
  upstream_commit: 4f5c53149b7e17d1c24445f68d79a83a3b2a17f9
  fork_repository: byronlai99/Fritchii-HDrum
  working_branch: feature/v5.8.4-renhdrum-zh-cn

# Release-note review is separate from fork-module definitions: upstream features must be
# preserved/adapted, not accidentally added as duplicate fork modules.
upstream_release_review:
  reviewed_tag: fritchii-v5.8.4
  reviewed_on: 2026-11-12
  release_notes_url: https://github.com/Frizti/Fritchii/releases/tag/fritchii-v5.8.4
  porting_rule: "For every future tag, map each release-note bullet to source changes, modules, translations, data paths, settings, and package checks; record an explicit action."
  upstream_features_to_preserve:
    - id: saves-profile-backup-and-fix
      release_note: "Saves copies now target Fritchii's own profile; the Saves window backs up before copy/import/fix, reports the backup path, offers Open backup, and can repair orphaned saves."
      action: "Preserve upstream behavior. Re-check active save destination, backup-before-write ordering, displayed backup path, Open backup action, and in-game save visibility."
      translation: "Reconcile all Saves actions, prompts, warnings, and completion messages in the QObject translation context."
    - id: switch2-12gb-dram-runtime-switch
      release_note: "Switch 2 games use the 12 GB memory layout while running and restore the previous setting after exit; the label is 12GB DRAM (Switch 2), not Unsafe, and it is no longer classified as OoT-only."
      action: "Preserve temporary runtime switching and restoration; verify Switch 1 behavior, setting label/help text, and OoT/per-game tuned-setting classification."
      translation: "Reconcile the renamed setting label and explanatory text."
    - id: dlss-quality-preset-per-game
      release_note: "DLSS quality and preset are available per game under Game Settings > Graphics with use-global behavior."
      action: "Preserve global fallback, per-game override, serialization, and restore behavior; do not recreate as a fork module."
      translation: "Add or update Chinese labels, descriptions, tooltips, and game-settings strings."
    - id: tuned-settings-reapply-on-upgrade
      release_note: "Fritchii tuned settings are applied once again with the update; users can edit them afterwards."
      action: "Inspect tuning revision / one-time reapply logic. Preserve RenHDrum gain and low-boost entries in OoT tuning. Ensure defaults are not reapplied every launch and later user edits survive."
      translation: "Check any changed tuning labels/help text."
    - id: dedicated-fritchii-profile-and-legacy-import
      release_note: "Current fork baseline uses the dedicated Fritchii profile root and first-run legacy profile import."
      action: "Preserve %APPDATA%\\fritchii, portable user-folder precedence, legacy source detection, copy-only source preservation, config path remapping, optional mods, cache exclusion, NAND/SDMC link fallback, backup/recovery, and Open folder notice. See the migration regression matrix in the workflow document."
      translation: "Translate first-run choice, source profile, progress, success, backup, link, shader preparation, failure, retry, and recovery UI."
  required_release_note_classification:
    - preserve_upstream
    - re_apply_enabled_fork_module
    - adapt_to_new_api
    - already_equivalent_upstream
    - manual_validation

modules:
  - id: renhdrum
    enabled: true
    name: RenHDrum controller haptics and HD Rumble
    version: 0.3.1
    source:
      repository: trzz1214/RenHDrum
      release: https://github.com/trzz1214/RenHDrum/releases/tag/v0.3.1
    integration:
      cmake_options:
        - ENABLE_RENHDRUM=ON
        - RENHDRUM_SDL_PATCHES=ON
      runtime_file: renhdrum.dll
      runtime_sha256: ff397c9e51a976ce8efad625c289589d38e36bf209860d8a87dc91fc17e748f7
      files:
        - CMakeLists.txt
        - cpmfile.json
        - externals/CMakeLists.txt
        - externals/renhdrum/renhdrum.h
        - .patch/sdl3-hdrumble/
        - src/input_common/CMakeLists.txt
        - src/input_common/drivers/sdl_driver.cpp
        - src/input_common/drivers/sdl_driver.h
        - src/input_common/renhdrum/
        - src/yuzu/CMakeLists.txt
        - src/yuzu/configuration/controller_haptics/
        - src/yuzu/configuration/configure_vibration.cpp
        - src/common/settings.h
        - src/common/frizti_settings.cpp
        - src/common/frizti_settings.h
        - dist/languages/zh_CN.ts
      migration_notes:
        - "Check the target SDL3 version before applying the SDL3 HD Rumble patches; adapt patch context rather than forcing old patches."
        - "NX2-only Settings::nx2_active_mode is not present in the v5.8.4 baseline. Do not copy that reference unless the new upstream base provides the symbol/API."
        - "Verify runtime DLL version and SHA-256 before packaging."
        - "Preserve hd_rumble_gain and hd_rumble_low_boost in Settings::Frizti::TunedSettings; the v5.8.4 integration carries tuning revision 13, one revision above the upstream v5.8.4 revision 12."
        - "When the tuned-settings list or its target defaults change, bump Settings::Frizti::Revision once; do not force the tuned values on every launch or erase user edits made after the one-time application."
    validation:
      - "Build with ENABLE_RENHDRUM=ON and RENHDRUM_SDL_PATCHES=ON."
      - "Confirm renhdrum.dll is next to lichii.exe in the test package."
      - "Verify OoT tuned settings include both hd_rumble_gain and hd_rumble_low_boost and that the revision-13 migration is applied once, then preserves subsequent user edits."
      - "Test Switch Pro Controller/Joy-Con HD Rumble and DualSense haptics where hardware is available."

  - id: chinese-ui
    enabled: true
    name: Simplified Chinese interface
    source:
      translation_file: dist/languages/zh_CN.ts
    integration:
      files:
        - dist/languages/zh_CN.ts
      migration_notes:
        - "Reconcile new and changed UI strings against the current upstream translation catalog."
        - "Do not overwrite newer upstream translations; retain our RenHDrum-specific Chinese strings."
    validation:
      - "Confirm Simplified Chinese is present in the language selector."
      - "Launch the app in Simplified Chinese and inspect the main UI and RenHDrum settings."

  - id: fork-branding
    enabled: true
    name: Fritchii-HDrum application identity and About UI
    integration:
      files:
        - src/yuzu/about_dialog.cpp
        - src/yuzu/aboutdialog.ui
        - src/yuzu/main.ui
        - src/yuzu/fritchii/fritchii_ui.cpp
        - dist/languages/zh_CN.ts
      migration_notes:
        - "Keep Help > About and the About dialog branded Fritchii-HDrum in both classic and Fritchii layouts; do not make the brand conditional on the UI mode."
        - "Keep the About title/body source strings and Simplified Chinese translation synchronized."
      validation:
        - "Inspect Help > About from both classic and Fritchii menu/layout modes."
        - "Confirm the title, build version, project name, source links, and Chinese translation identify Fritchii-HDrum."

  - id: fork-update-channel
    enabled: true
    name: Fritchii-HDrum release source and in-app updater
    source:
      repository: byronlai99/Fritchii-HDrum
    integration:
      files:
        - src/frontend_common/update_checker.cpp
        - src/frontend_common/update_checker.h
        - src/yuzu/updater/update_dialog.cpp
        - src/tests/common/update_checker.cpp
      expected_contract:
        release_repository: byronlai99/Fritchii-HDrum
        version_tags:
          - fritchii-vN
          - fritchii-vN.M
          - fritchii-vN.M.P
        legacy_tag_prefix: frizti-v
        windows_asset: Fritchii-HDrum-v<version>-Windows-x64.zip
        requires_github_sha256_digest: true
        hidden_release_marker: "<!-- fritchii:no-update -->"
        platform: Windows
      migration_notes:
        - "Do not restore the upstream Frizti/Lichii release repository or old package-name rules."
        - "The updater selects only the exact Windows ZIP name and canonical URL; debug ZIPs and 7z are not auto-update packages."
        - "Release metadata must include a GitHub SHA-256 digest or the dialog opens the release page instead of installing automatically."
        - "Keep the Fritchii-HDrum User-Agent in the download client."
        - "The current build workflow's v5.8.4-preview tag and RenHDrum-zh-CN ZIP name do not satisfy this contract; align them before enabling publication."
      validation:
        - "Run Catch2 updater tests in src/tests/common/update_checker.cpp."
        - "Test release metadata for accepted/rejected tags, exact repo URL, exact ZIP name, numeric version order, hidden marker, and SHA-256 digest."
        - "Verify a real release is discoverable by the Windows in-app updater before marking auto-update as verified."

  - id: accurate-vibration-default
    enabled: true
    name: Enable Accurate Vibration by default
    integration:
      setting:
        file: src/common/settings.h
        key: enable_accurate_vibrations
        default: true
      migration_notes:
        - "This is separate from vibration_enabled and RenHDrum hd_rumble_enabled."
        - "Check whether the new upstream changed the setting type, persistence, or UI label before applying the default."
        - "A default change does not necessarily overwrite an existing user's saved false value; inspect migration behavior and do not silently force-reset user configuration."
    validation:
      - "Check the fresh-profile default is enabled."
      - "Check the Controls UI reflects the enabled state."

  - id: controls-ui-pr36
    enabled: true
    name: Controls settings layout and controller preview fixes
    source:
      pull_request: https://github.com/Frizti/Fritchii/pull/36
      head_commit: 483996c742ba82facfef8967304fa1c0921378db
    integration:
      files:
        - src/yuzu/configuration/configure_dialog.cpp
        - src/yuzu/configuration/configure_input_player.ui
        - src/yuzu/configuration/configure_input_player_widget.cpp
        - src/yuzu/fritchii/style.qss
      expected_changes:
        - "Settings dialog default size: 1080x700."
        - "Device selector minimumContentsLength: 20."
        - "Controller preview scales to the available widget area."
        - "Controls-only compact styling for mapping buttons, group boxes, labels, combo boxes, and player tabs."
      migration_notes:
        - "Inspect current upstream UI changes first; skip or adapt any parts already fixed upstream."
        - "Preserve existing Fritchii styling and keep compact rules scoped to ConfigureInput and ConfigureInputPlayer."
    validation:
      - "Open Controls settings at normal and compact window sizes."
      - "Verify left and right controls, controller preview, all player tabs, and profile buttons remain visible."

# Build and packaging policy (not an optional feature module).
build_policy:
  platform: Windows x64
  toolchain: MSVC
  pgo: false
  release_artifact_only: true
  publish_github_release: workflow_dispatch
  publish_release_input_default: false
  release_channel: prerelease
  release_formats:
    - zip
    - 7z
  cmake_options:
    - ENABLE_QT_TRANSLATION=ON
  package_excludes:
    - eden-cli.exe
    - vc_redist*
    - "*.pdb"
  artifact_retention_days: 7
  archive_content_audit:
    mandatory: true
    automated_in_current_workflow: false
    current_status: outstanding
    required_entries:
      - lichii.exe
      - renhdrum.dll
      - "recipes/OoT v131072 (cache v54).nx2recipe"
      - Qt runtime DLLs and plugins
      - "zh_CN translation embedded in lichii.exe resources"
    forbidden_entries:
      - eden-cli.exe
      - vc_redist*
      - "*.pdb"
      - translations/
    verification: "List the members of the finished ZIP and 7z separately; 7z test/existence alone is not a content manifest."
  required_assets:
    - path: "recipes/OoT v131072 (cache v54).nx2recipe"
      source_release: Frizti/Fritchii@fritchii-v5.5
      source_url: https://github.com/Frizti/Fritchii/releases/download/fritchii-v5.5/Fritchii-v5.5-Windows-x64.zip
      source_archive_sha256: 63112e7125e6174192079475b485f9633509a4a8dfb2630b5f8a96c644abf066
      file_sha256: 85d944c8557fbeffe02af566c9c4277251ed0ab1a0f2a3ab7a626af6a877c3a1
      update_policy: "Immutable; do not regenerate or replace unless the user explicitly requests it."
      packaging: "Extract the single matching recipe entry into build/release/bin/recipes/ after verifying both hashes."

fork_release_contract:
  updater_repository: byronlai99/Fritchii-HDrum
  accepted_tag_forms:
    - fritchii-v<version>
    - frizti-v<version>
  canonical_tag_format: fritchii-v<version>
  required_windows_asset: Fritchii-HDrum-v<version>-Windows-x64.zip
  accepted_auto_update_format: zip
  manual_download_alternative: 7z
  sha256_digest_required_for_automatic_install: true
  hidden_release_marker: "<!-- fritchii:no-update -->"
  current_workflow_mismatch:
    generated_tag: "v5.8.4-preview.<run_number>"
    generated_zip: "Fritchii-v5.8.4-RenHDrum-zh-CN-Windows-x64.zip"
    status: open_pre_publish_blocker
    impact: "The in-app updater will not parse this tag or select this ZIP. Manual download is unaffected."
    resolution: "Before enabling publish_release, align tag and ZIP filename with the updater contract and confirm the GitHub SHA-256 asset digest."

# Historical integration failures and recurring workflow portability checks.
# Do not delete old entries when moving to a newer upstream tag.
integration_failure_ledger:
  - id: F-001-msvc-c4457-c4458-name-hiding
    evidence:
      workflow_run: 43043541561
      workflow_run_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43043541561
      tested_commit: a7fe6fdaae4e6c46118454726ba2d4dea69a3c33
      stage: Build
      configure_result: passed
    status: fixed_in_current_branch
    symptoms:
      - "C4458: state hid a class member in src/video_core/engines/kepler_compute.cpp:1664."
      - "C4458: state hid a class member in src/video_core/engines/maxwell_3d.cpp:2825."
      - "C4457: count hid a function parameter in src/video_core/engines/maxwell_3d.cpp:2377 and :2381."
    resolution:
      - "Renamed state locals to bypass_state and draw_state."
      - "Renamed count locals to dispatch_count and unbounded_count."
      - "Kept the MSVC warning policy intact; fixed the source names instead of suppressing diagnostics."
    prevention:
      - "Scan every changed/new C++ file for C4456, C4457, C4458 and all target warnings promoted to errors."
      - "Inspect function parameters, class members, and base-class members for name collisions."
  - id: F-002-v584-nx2-api-version-skew
    evidence:
      baseline: fritchii-v5.8.4
      module: RenHDrum v0.3.0
    status: fixed_in_current_branch
    symptoms:
      - "Settings::nx2_active_mode was referenced although it is absent from the v5.8.4 baseline."
      - "The NX2-mode RenHDrum symbol was not part of the selected v0.3.0 integration API."
    resolution:
      - "Removed the NX2-only setting dependency from the v5.8.4 RenHDrum path."
      - "Removed the unused NX2-mode runtime symbol lookup."
    prevention:
      - "Check every imported type, setting, function, and DLL export against the exact target tag and selected runtime release."
      - "Never carry API assumptions from another branch or module-author fork without verifying the target source."
  - id: F-003-external-workflow-portability
    evidence:
      context: recurring_cross_project_integration_risk
    status: mandatory_preflight_control
    symptoms:
      - "External module workflows may use a different OS, architecture, compiler, warning policy, CMake options, dependency pin, or artifact layout."
      - "A passing external workflow or successful CMake configure does not prove our Windows x64 MSVC yuzu and yuzu-cmd targets compile and link."
    resolution:
      - "Do not copy external GitHub Actions workflows wholesale."
      - "Translate only required dependencies/setup into the fork-owned workflow and test the actual release targets."
    prevention:
      - "Record runner, compiler, generator, Qt/SDL3/CPM versions, CMake options, targets, and artifact path for each upgrade."
  - id: F-005-msvc-c4505-invalid-warning-switch
    evidence:
      workflow_runs:
        - 43043541561
        - 43049341434
        - 43068107673
      upstream_baseline_reproduction_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43068107673
      latest_workflow_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43049341434
      baseline_file: src/CMakeLists.txt
      upstream_baseline: Frizti/Fritchii@fritchii-v5.8.4
      stage: Build
    status: fixed_in_current_branch
    symptoms:
      - "MSVC repeatedly emitted D9014: invalid value 505 for /w4."
      - "The generated compiler command contained /w4505."
    root_cause:
      - "The upstream v5.8.4 src/CMakeLists.txt used /w4505 where /wd4505 was intended to disable C4505."
      - "The malformed option was interpreted as /w4 with invalid warning number 505."
    resolution:
      - "Corrected /w4505 to /wd4505 without changing the warning level or weakening the C445x-as-error policy."
    prevention:
      - "Inspect generated MSVC command lines for exact /wdNNNN, /weNNNN and /wN syntax."
      - "Do not assume an upstream warning flag is valid merely because it is present in the baseline."
  - id: F-006-nx2-decoder-packet-name-hiding
    evidence:
      workflow_run: 43049341434
      workflow_run_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43049341434
      tested_commit: 2177f5d8e9deed6a1b2976ba428c755010922c18
      file: src/video_core/host1x/nx2_video_decoder.cpp
      line: 236
      stage: Build
    status: fixed_in_current_branch
    symptoms:
      - "C4458: SendReceive parameter packet hid Nx2VideoDecoder::Impl::packet."
    resolution:
      - "Renamed the SendReceive parameter to input_packet and passed it to context->SendPacket."
      - "Kept the Impl::packet byte buffer unchanged."
    prevention:
      - "Scan all target-baseline C++ sources, not just module-specific changed files, for C4456/C4457/C4458."
      - "Check method parameters against members of nested implementation classes."
  - id: F-007-vulkan-precompiled-index-name-hiding
    evidence:
      workflow_run: 43058500053
      workflow_run_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43058500053
      tested_commit: 996f7f0821c4200ddf6b897364d1fd922af7cc0a
      file: src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
      line: 5186
      stage: Build
    status: fixed_in_current_branch
    symptoms:
      - "C4456: loop variable index was redeclared in CreatePrecompiledGraphicsPipeline after const auto index = KeptIndex()."
    resolution:
      - "Renamed the loop variable and its array accesses to shader_index; the cache index object is unchanged."
    prevention:
      - "Inspect the full containing function for earlier declarations before reusing common local names such as index."
      - "Search all target-baseline C++ sources for C4456/C4457/C4458, not only module-specific files."
  - id: F-004-package-contents-regression
    evidence:
      context: historical_v5x_packaging_iteration
      detail: "A previously reported archive contained only two files; the originating run/log is not currently retained here."
    status: historical_symptom_root_cause_unconfirmed
    symptoms:
      - "The uploaded archive did not contain the expected complete application package."
    resolution:
      - "Do not assign a root cause without the originating run evidence."
    prevention:
      - "Inspect the final archive contents, not only the artifact-upload step."
      - "Verify executable, Qt/runtime dependencies, RenHDrum DLL, translations, recipes/assets, and required files."
      - "Verify eden-cli.exe, vc_redist*, and *.pdb are absent."


  - id: F-008-msvc-c4458-service-manager-shadow
    evidence:
      workflow_run: 43065581977
      workflow_run_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43065581977
      tested_commit: 4835fe1d2ac861e173f39c367cf9ce0bfc97e965
      stage: Build
    status: fixed_and_ci_verified
    verified_by_run: 43070225601
    verification: "Windows x64 MSVC Build, Package test binary, and Upload test artifact all succeeded; no compiler diagnostics or D9014 were present."
    symptoms:
      - "C4458 at src/core/core.cpp:253: RefreshTime local service_manager hides Core::System::Impl::service_manager at line 656."
    resolution:
      - "Renamed only the local reference to current_service_manager and updated its three GetService uses in commit 9e053b5a7af47e4c8281da9ecf99de60f5f70bb2."
      - "No service lookup order or runtime behavior was changed."
    prevention:
      - "Search class methods for locals that reuse member identifiers, including references returned by System accessors."
  - id: F-009-upstream-v584-frizti-settings-c4459
    evidence:
      workflow_run: 43068107673
      workflow_run_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43068107673
      job_id: 130688435891
      tested_branch: experiment/upstream-v5.8.4-clean
      tested_commit: 4f5c53149b7e17d1c24445f68d79a83a3b2a17f9
      stage: Build
      source_origin: pristine_upstream
    status: confirmed_pristine_upstream_error_already_fixed_in_active_integration_branch
    symptoms:
      - "C4459 at src/common/frizti_settings.cpp:25: TunedSettings parameter values hides Settings::values."
      - "C4459 at src/common/frizti_settings.cpp:136: FixDockedController parameter values hides Settings::values."
      - "C4459 at src/common/frizti_settings.cpp:147: local values in GlobalValues hides Settings::values."
      - "C4459 at src/common/frizti_settings.cpp:155: local values in PerGameValues hides Settings::values."
      - "The hidden global is declared in src/common/settings.h:1075."
    root_cause:
      - "The pristine v5.8.4 source has local parameters/declarations named values that shadow the global Settings::values object."
      - "The fork's strict /we4459 setting promotes these MSVC name-hiding diagnostics to errors."
    resolution:
      - "The active integration branch already carries the equivalent local-name fix from commit fd79995f08f1acd6f23adf867538698c5ead8f29; it uses settings for the TunedSettings/FixDockedController parameters and result for GlobalValues/PerGameValues map locals."
      - "The pristine upstream reference remains unchanged. On a future baseline-first upgrade, apply/verify the fix only on a dedicated MSVC-fix branch after first reducing the workflow matrix to Windows x64 MSVC."
      - "Do not suppress C4459 or weaken the warning policy."
    prevention:
      - "Before the first build of each upstream tag, scan the full target source for C4456/C4457/C4458/C4459 and all configured /we diagnostics."
      - "Record whether each issue comes from pristine upstream, workflow adaptation, or fork-module integration."

  - id: F-012-recipe-archive-entry-path-mismatch
    evidence:
      failing_workflow_run: 43081539323
      failing_workflow_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43081539323
      failing_commit: 2d72446a8c6c552bd74183d2a01154c2fdfb9d6b
      verification_workflow_run: 43081887600
      verification_workflow_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43081887600
      verification_commit: 8802040f402756bce225d56b4e7c35ea6beb3fa3
      stage: Package test binary
    status: fixed_and_ci_verified
    symptoms:
      - "Build succeeded but packaging failed because exact full-path matching found zero OoT cache-v54 recipe entries in the official v5.5 ZIP."
    root_cause:
      - "The ZIP entry's internal directory prefix did not match the assumed recipes/ path, although the filename was present."
    resolution:
      - "Match the exact basename OoT v131072 (cache v54).nx2recipe, require exactly one entry, and preserve both pinned archive and extracted-file SHA-256 checks."
    prevention:
      - "Do not assume archive internal folder layout; inspect the ZIP entry names or match exact basename."
      - "Fail when there are zero or multiple matching entries, then verify the extracted file hash and final package presence."

  - id: F-013-updater-tag-asset-contract-mismatch
    evidence:
      inspected_workflow_run: 43158492258
      workflow_run_url: https://github.com/byronlai99/Fritchii-HDrum/actions/runs/43158492258
      workflow_file: .github/workflows/renhdrum-v584-build.yml
      updater_source: src/frontend_common/update_checker.cpp
      status_detail: "The publish step was skipped in run #34; this mismatch was found by static comparison, not a failed published update."
    status: open_pre_publish_blocker
    symptoms:
      - "The workflow is configured to publish v5.8.4-preview.<run_number> and Fritchii-v5.8.4-RenHDrum-zh-CN-Windows-x64.zip."
