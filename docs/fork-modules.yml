workflow_portability_policy:
  upstream_reference:
    repository: Frizti/Fritchii
    tag: fritchii-v5.8.4
    workflow: .github/workflows/release-binaries.yml
    url: https://github.com/Frizti/Fritchii/blob/fritchii-v5.8.4/.github/workflows/release-binaries.yml
  intentional_v584_fork_differences:
    - "YUZU_USE_BUNDLED_SDL3=OFF with RENHDRUM_SDL_PATCHES=ON selects the sdl3-hdrumble CPM package; upstream ON selects sdl3-ci and bypasses the custom RenHDrum SDL3 patch path."
    - "ENABLE_RENHDRUM=ON and RENHDRUM_SDL_PATCHES=ON enable the controller integration."
    - "ENABLE_QT_TRANSLATION=ON compiles the fork's Simplified Chinese catalog."
    - "Use the upstream windeployqt --release --no-translations deployment option; zh_CN is embedded in the app resource."
    - "Upload a short-retention test artifact only; remove eden-cli.exe, vc_redist*, and *.pdb per fork package policy."
  authoritative_workflow: .github/workflows/renhdrum-v584-build.yml
  rule: "External module workflows are reference material only; the fork-owned MSVC workflow is authoritative."
  compare_before_porting:
    - runner_os_and_architecture
    - compiler_toolchain_and_warning_policy
    - cmake_generator_configuration_options_and_targets
    - qt_sdl3_cpm_versions_and_source_patches
    - generated_resources_and_translation_pipeline
    - executable_runtime_dll_and_artifact_layout
  recurring_dependency_checks:
    - "Apply SDL3 patches to the exact CPM-resolved source revision and verify patched symbols are available to the final link."
    - "Verify RenHDrum required/optional symbols against the selected header and actual DLL exports."
    - "Verify app-embedded zh_CN Qt resources separately from Qt translation files deployed by windeployqt."
    - "Inspect the archive itself for required and excluded files."

