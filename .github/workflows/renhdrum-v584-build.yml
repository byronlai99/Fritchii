name: v5.8.4 RenHDrum Windows test build

on:
  push:
    branches:
      - feature/v5.8.4-renhdrum-zh-cn
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "recipes/**"
      - "cpmfile.json"
      - ".patch/**"
      - ".github/workflows/renhdrum-v584-build.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this build as a GitHub pre-release with ZIP and 7z assets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renhdrum-v584-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64-msvc:
    name: Windows x64 MSVC
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-windows-x86_64-v5.8.4-renhdrum-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-windows-x86_64-v5.8.4-renhdrum-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-windows-x86_64-v5.8.4-renhdrum-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-windows-x86_64-v5.8.4-renhdrum-${{ github.sha }}-
            objects-windows-x86_64-v5.8.4-renhdrum-

      - name: Configure Windows
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=OFF
          -DENABLE_QT_TRANSLATION=ON
          -DENABLE_RENHDRUM=ON
          -DRENHDRUM_SDL_PATCHES=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DLICHII_BUILD_TAG=feature-v5.8.4-renhdrum-zh-cn
          -DLICHII_BUILD_PLATFORM=windows-x86_64
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          sccache --show-stats

      - name: Stop sccache
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package test binary
        shell: pwsh
        run: |
          $bin = (Resolve-Path 'build/release/bin').Path
          if (-not (Test-Path (Join-Path $bin 'lichii.exe'))) {
            throw 'lichii.exe was not produced'
          }
          # Match the upstream v5.8.4 MSVC workflow. This skips Qt's separately deployed
          # translation catalogs; the app's zh_CN catalog is compiled into its own Qt resource.
          windeployqt --release --no-translations (Join-Path $bin 'lichii.exe')
          # All application language catalogs are embedded in lichii.exe.
          Remove-Item (Join-Path $bin 'translations') -Recurse -Force -ErrorAction SilentlyContinue

          $dll = Join-Path $bin 'renhdrum.dll'
          Invoke-WebRequest -Uri 'https://github.com/trzz1214/RenHDrum/releases/download/v0.3.1/renhdrum.dll' -OutFile $dll
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($hash -ne 'ff397c9e51a976ce8efad625c289589d38e36bf209860d8a87dc91fc17e748f7') {
            throw "RenHDrum v0.3.1 DLL SHA-256 mismatch: $hash"
          }

          # Preserve the exact OoT cache-v54 recipe used by the previous Fritchii-HDrum package.
          # It is extracted from the official v5.5 Windows package and both archive/file hashes are pinned.
          $recipeZip = Join-Path $env:RUNNER_TEMP 'Fritchii-v5.5-Windows-x64.zip'
          $recipeUrl = 'https://github.com/Frizti/Fritchii/releases/download/fritchii-v5.5/Fritchii-v5.5-Windows-x64.zip'
          $recipeZipSha256 = '63112e7125e6174192079475b485f9633509a4a8dfb2630b5f8a96c644abf066'
          $recipeSha256 = '85d944c8557fbeffe02af566c9c4277251ed0ab1a0f2a3ab7a626af6a877c3a1'
          $recipePath = 'recipes/OoT v131072 (cache v54).nx2recipe'

          Invoke-WebRequest -Uri $recipeUrl -OutFile $recipeZip
          $downloadedRecipeZipHash = (Get-FileHash -Algorithm SHA256 $recipeZip).Hash.ToLowerInvariant()
          if ($downloadedRecipeZipHash -ne $recipeZipSha256) {
            throw "Official Fritchii v5.5 recipe archive SHA-256 mismatch: $downloadedRecipeZipHash"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $recipeArchive = [System.IO.Compression.ZipFile]::OpenRead($recipeZip)
          try {
            $recipeFileName = 'OoT v131072 (cache v54).nx2recipe'
            $recipeEntries = @(
              $recipeArchive.Entries |
                Where-Object { $_.FullName.Split('/')[-1] -eq $recipeFileName }
            )
            if ($recipeEntries.Count -ne 1) {
              throw "Expected exactly one '$recipeFileName' in the official package; found $($recipeEntries.Count)"
            }

            $recipeDestination = Join-Path $bin $recipePath
            $recipeDirectory = Split-Path -Parent $recipeDestination
            New-Item -ItemType Directory -Path $recipeDirectory -Force | Out-Null

            $sourceStream = $recipeEntries[0].Open()
            try {
              $destinationStream = [System.IO.File]::Create($recipeDestination)
              try {
                $sourceStream.CopyTo($destinationStream)
              }
              finally {
                $destinationStream.Dispose()
              }
            }
            finally {
              $sourceStream.Dispose()
            }
          }
          finally {
            $recipeArchive.Dispose()
          }

          $copiedRecipeHash = (Get-FileHash -Algorithm SHA256 $recipeDestination).Hash.ToLowerInvariant()
          if ($copiedRecipeHash -ne $recipeSha256) {
            throw "OoT v131072 cache v54 recipe SHA-256 mismatch: $copiedRecipeHash"
          }
          Write-Host "Verified recipe: $recipePath ($copiedRecipeHash)"

          Remove-Item (Join-Path $bin 'eden-cli.exe') -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bin -Filter '*.pdb' -File -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path $bin -Force |
            Where-Object { $_.Name -like 'vc_redist*' } |
            Remove-Item -Recurse -Force
          Get-ChildItem $bin | Select-Object Name, Length
          if (-not (Test-Path $dll)) {
            throw 'renhdrum.dll is missing from the test package'
          }

      - name: Create and verify ZIP and 7z packages
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) {
            choco install 7zip.install --yes --no-progress
          }
          if (-not (Test-Path $sevenZip)) {
            throw '7-Zip was not found after installation'
          }

          $bin = (Resolve-Path 'build/release/bin').Path
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'build/release/packages'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $base = 'Fritchii-HDrum-v5.8.4-Windows-x64'
          $zip = Join-Path $packageDir "$base.zip"
          $archive7z = Join-Path $packageDir "$base.7z"

          Push-Location $bin
          try {
            & $sevenZip a -tzip -mx=9 $zip '.\*'
            if ($LASTEXITCODE -ne 0) { throw "ZIP creation failed: $LASTEXITCODE" }
            & $sevenZip a -t7z -mx=9 $archive7z '.\*'
            if ($LASTEXITCODE -ne 0) { throw "7z creation failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          & $sevenZip t $zip
          if ($LASTEXITCODE -ne 0) { throw "ZIP integrity test failed: $LASTEXITCODE" }
          & $sevenZip t $archive7z
          if ($LASTEXITCODE -ne 0) { throw "7z integrity test failed: $LASTEXITCODE" }

          Get-ChildItem $packageDir | Select-Object Name, Length
          if (-not (Test-Path $zip) -or -not (Test-Path $archive7z)) {
            throw 'Both ZIP and 7z packages must exist'
          }

      - name: Upload ZIP and 7z test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Fritchii-HDrum-v5.8.4-Windows-x64-${{ github.sha }}
          path: build/release/packages/
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub pre-release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_dir="${GITHUB_WORKSPACE}/build/release/packages"
          base="Fritchii-HDrum-v5.8.4-Windows-x64"
          zip="${package_dir}/${base}.zip"
          archive7z="${package_dir}/${base}.7z"
          tag="v5.8.4-preview.${GITHUB_RUN_NUMBER}"
          title="Fritchii-HDrum v5.8.4 Preview ${GITHUB_RUN_NUMBER}"
          notes="Windows x64 MSVC preview build. Both ZIP and 7z contain the same validated package. This is a pre-release, not a stable release."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" "$archive7z" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" "$zip" "$archive7z" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
