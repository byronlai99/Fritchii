name: release-binaries
# Re-run v5.6 MSVC build after the upstream merge.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: false
  push:
    branches:
      - nx2-experimental
      - oot-gather-fix
      - feature/renhdrum-v0.3.0-v5.5
      - 'refactor/**'
      - 'sync/**'
      - fix/v5.6-msvc-c4458-packet-shadow
      - feature/dlss-frame-generation-v5.6
      - feature/dlss-frame-generation-fractional
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/release-binaries.yml"
      - "docs/releases/**"

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare release tag
        if: (github.event_name == 'push' && github.ref_name != 'feature/dlss-frame-generation-v5.6' && github.ref_name != 'feature/dlss-frame-generation-fractional' && !startsWith(github.ref_name, 'refactor/') && !startsWith(github.ref_name, 'sync/')) || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: Windows x64 MSVC
    needs: prepare-release
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache on Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-windows-x86_64-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-windows-x86_64-v2-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-windows-x86_64-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-windows-x86_64-v2-${{ github.sha }}-
            objects-windows-x86_64-v2-

      - name: Configure Windows
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=OFF
          -DENABLE_RENHDRUM=ON
          -DENABLE_QT_TRANSLATION=ON
          -DRENHDRUM_DOWNLOAD=OFF
          -DRENHDRUM_SDL_PATCHES=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DLICHII_BUILD_TAG=build-${{ github.run_number }}
          -DLICHII_BUILD_PLATFORM=windows-x86_64
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          sccache --show-stats

      - name: Stop sccache on Windows
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Stage Windows executable
        shell: pwsh
        run: |
          $exe = 'build/release/bin/lichii.exe'
          if (-not (Test-Path $exe)) { throw "Main executable was not produced: $exe" }
          New-Item -ItemType Directory -Path 'release-exe' -Force | Out-Null
          Copy-Item $exe 'release-exe/lichii.exe' -Force
          Get-Item 'release-exe/lichii.exe' | Select-Object Name, Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: Fritchii-HDrum-Windows-x64-${{ github.sha }}
          path: release-exe/lichii.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: (github.event_name == 'push' && github.ref_name != 'feature/dlss-frame-generation-v5.6' && github.ref_name != 'feature/dlss-frame-generation-fractional' && !startsWith(github.ref_name, 'refactor/') && !startsWith(github.ref_name, 'sync/')) || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download Windows executable
        uses: actions/download-artifact@v7
        with:
          name: Fritchii-HDrum-Windows-x64-${{ github.sha }}
          path: built-exe

      - name: Package release files
        id: package-release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < dist/frizti_version.txt)"
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid Fritchii version: $version"
            exit 1
          fi
          archive="Fritchii-HDrum-v${version}-Windows-x64.zip"
          exe="built-exe/lichii.exe"
          if [[ ! -s "$exe" ]]; then
            echo "Freshly built lichii.exe is missing"
            find built-exe -maxdepth 2 -type f -print || true
            exit 1
          fi

          # Start from the last verified v5.6 + RenHDrum package.
          # Runtime DLLs, Qt plugins, SDL3 transport and recipe are copied as-is.
          base_zip="$RUNNER_TEMP/Fritchii-HDrum-build-59.zip"
          base_url="https://github.com/byronlai99/Fritchii-HDrum/releases/download/build-59/Fritchii-HDrum-v5.6-Windows-x64.zip"
          base_sha256="d82f59a2fd46d55233f4666df6a74d0544cda0918286bc7921e76b33468096f9"
          curl --fail --location --retry 3 --retry-delay 2 --output "$base_zip" "$base_url"
          printf '%s  %s\n' "$base_sha256" "$base_zip" | sha256sum --check -

          artifact_dir="$RUNNER_TEMP/windows-package"
          mkdir -p "$artifact_dir"
          unzip -q "$base_zip" -d "$artifact_dir"
          if [[ ! -s "$artifact_dir/lichii.exe" ]]; then
            echo "The verified base package does not contain lichii.exe"
            exit 1
          fi

          # Replace only the application executable; keep every other file byte-for-byte.
          install -m 755 "$exe" "$artifact_dir/lichii.exe"

          recipe_path="recipes/OoT v131072 (cache v54).nx2recipe"
          recipe_sha256="85d944c8557fbeffe02af566c9c4277251ed0ab1a0f2a3ab7a626af6a877c3a1"
          for required in "lichii.exe" "renhdrum.dll" "Qt6Core.dll" "platforms/qwindows.dll" "$recipe_path"; do
            if [[ ! -s "$artifact_dir/$required" ]]; then
              echo "Base package is missing required runtime file: $required"
              exit 1
            fi
          done
          printf '%s  %s\n' "$recipe_sha256" "$artifact_dir/$recipe_path" | sha256sum --check -

          file_count=$(find "$artifact_dir" -type f | wc -l)
          if (( file_count < 30 )); then
            echo "Only $file_count files found in the Windows package; refusing to publish"
            find "$artifact_dir" -type f -print | sort
            exit 1
          fi

          mkdir -p dist
          (cd "$artifact_dir" && zip -qr "${GITHUB_WORKSPACE}/dist/${archive}" .)
          zip_entries=$(unzip -Z1 "dist/$archive")
          for required in "lichii.exe" "renhdrum.dll" "Qt6Core.dll" "platforms/qwindows.dll" "$recipe_path"; do
            if ! grep -Fxq "$required" <<< "$zip_entries"; then
              echo "Final ZIP is missing required file: $required"
              exit 1
            fi
          done
          if grep -Eq '(^|/)(eden-cli\.exe|vc_redist\.x64\.exe|eden-cli\.pdb|lichii\.pdb)$' <<< "$zip_entries"; then
            echo "The Windows package contains an excluded file:"
            grep -E '(^|/)(eden-cli\.exe|vc_redist\.x64\.exe|eden-cli\.pdb|lichii\.pdb)$' <<< "$zip_entries"
            exit 1
          fi
          zip_entry_count=$(wc -l <<< "$zip_entries")
          if (( zip_entry_count < 30 )); then
            echo "Final ZIP contains only $zip_entry_count entries; refusing to publish"
            exit 1
          fi
          echo "Final ZIP contains $zip_entry_count entries"
          unzip -l "dist/$archive" | tail -5
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${archive}"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package-release.outputs.version }}
          ARCHIVE: ${{ steps.package-release.outputs.archive }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/build-${GITHUB_RUN_NUMBER}" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag build-${GITHUB_RUN_NUMBER} points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          tag="build-${GITHUB_RUN_NUMBER}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          title="Fritchii v${VERSION} | Fritchii-HDrum build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          changelog="docs/releases/v5.6-hdrum.md"
          if [[ ! -s "$changelog" ]]; then
            echo "Release changelog is missing or empty: $changelog"
            exit 1
          fi

          {
            cat <<EOF
          Automatic Windows x64 MSVC build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}.

          EOF
            cat "$changelog"
            cat <<EOF

          ## Windows

          Windows x64 MSVC package: [Download ZIP](${base}/${ARCHIVE}).

          Extract the ZIP and run \`lichii.exe\`.
          EOF
          } > notes.md

          gh release create "$tag" "dist/${ARCHIVE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "$title" \
            --notes-file notes.md
      - name: Verify the release tag matches the run number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="build-${GITHUB_RUN_NUMBER}"
          published_tag=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
          published_title=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')
          if [ "$published_tag" != "$expected" ] || [[ "$published_title" != *" build ${GITHUB_RUN_NUMBER} ("* ]]; then
            echo "Release is tagged '$published_tag' and titled '$published_title', expected tag $expected and a title naming build ${GITHUB_RUN_NUMBER}"
            exit 1
          fi
