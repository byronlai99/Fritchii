name: release-binaries
# Re-run v5.5 MSVC build after the upstream merge.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - nx2-experimental
      - oot-gather-fix
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare release tag
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: Windows x64 MSVC
    needs: prepare-release
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache on Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-windows-x86_64-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-windows-x86_64-v2-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-windows-x86_64-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-windows-x86_64-v2-${{ github.sha }}-
            objects-windows-x86_64-v2-

      - name: Configure Windows
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DLICHII_BUILD_TAG=build-${{ github.run_number }}
          -DLICHII_BUILD_PLATFORM=windows-x86_64
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          sccache --show-stats

      - name: Stop sccache on Windows
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package Windows binary
        shell: pwsh
        run: |
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe

          # Keep the release focused on the main app and its runtime dependencies.
          $bin = (Resolve-Path 'build/release/bin').Path
          Remove-Item (Join-Path $bin 'eden-cli.exe') -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $bin -Filter '*.pdb' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Get-ChildItem -Path $bin -Force |
            Where-Object { $_.Name -like 'vc_redist*' } |
            Remove-Item -Recurse -Force
          Get-ChildItem $bin | Select-Object Name, Length

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: lichii-windows-x86_64-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: lichii-windows-x86_64-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          (cd artifacts && zip -qr "${GITHUB_WORKSPACE}/dist/lichii-windows-x86_64.zip" .)
          ls -la dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/build-${GITHUB_RUN_NUMBER}" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag build-${GITHUB_RUN_NUMBER} points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          tag="build-${GITHUB_RUN_NUMBER}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cat > notes.md <<EOF
          Automatic Windows x64 MSVC build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}.

          ## Windows

          Windows x64 MSVC package: [Download ZIP](${base}/lichii-windows-x86_64.zip).

          Extract the ZIP and run \`lichii.exe\`.
          EOF

          gh release create "$tag" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "Fritchii v5.3 ${GITHUB_REF_NAME} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md

      - name: Verify the release tag matches the run number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="build-${GITHUB_RUN_NUMBER}"
          published_tag=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
          published_title=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')
          if [ "$published_tag" != "$expected" ] || [[ "$published_title" != *" build ${GITHUB_RUN_NUMBER} ("* ]]; then
            echo "Release is tagged '$published_tag' and titled '$published_title', expected tag $expected and a title naming build ${GITHUB_RUN_NUMBER}"
            exit 1
          fi
